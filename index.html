<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Izla &amp; Gabriel · 7. November 2026</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;500;700&family=Cormorant:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream:    '#FAF7F1',
          ivory:    '#F5EFE3',
          sand:     '#E9DFCC',
          mocha:    '#B89B7A',
          coffee:   '#8B6F4E',
          espresso: '#3E2C20',
          ink:      '#2B1F16',
        },
        fontFamily: {
          display: ['"Playfair Display"', 'serif'],
          script:  ['"Cormorant Garamond"', 'serif'],
          body:    ['Lato', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --bg: #FAF7F1;
    --bg-soft: #F5EFE3;
    --line: #D8C9AE;
    --mocha: #B89B7A;
    --coffee: #8B6F4E;
    --espresso: #3E2C20;
    --ink: #2B1F16;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: 'Lato', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Playfair Display', serif; }
  .font-script  { font-family: 'Cormorant Garamond', serif; }

  /* small utilities */
  .hairline { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
  .vline    { width: 1px;  background: linear-gradient(180deg, transparent, var(--line), transparent); }

  /* fade-in on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.is-in { opacity: 1; transform: none; }

  /* hero ken-burns */
  @keyframes kenburns { 0% { transform: scale(1.04) translate(0,0); } 100% { transform: scale(1.14) translate(-1.5%, -1%); } }
  .kenburns { animation: kenburns 22s ease-in-out infinite alternate; }

  /* gentle floating leaf icons */
  @keyframes drift { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .drift { animation: drift 6s ease-in-out infinite; }

  /* shimmer on countdown numbers when they tick */
  @keyframes tick { 0% { transform: translateY(-6px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .tick { animation: tick .4s ease; }

  /* RSVP focus rings */
  .field {
    background: #FBF8F1;
    border: 1px solid #E0D2B7;
    color: var(--espresso);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field:focus { outline: none; border-color: var(--coffee); box-shadow: 0 0 0 4px rgba(139,111,78,.12); background: #fff; }

  /* button */
  .btn-primary {
    background: linear-gradient(180deg, #8B6F4E 0%, #6B5239 100%);
    color: #FAF7F1;
    box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 24px -10px rgba(62,44,32,.5);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    letter-spacing: .04em;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 14px 28px -10px rgba(62,44,32,.55); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent; color: var(--espresso); border: 1px solid var(--line);
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn-ghost:hover { background: #F1E7D3; border-color: var(--mocha); }

  .btn-glass {
    color: #FAF7F1;
    border: 1px solid rgba(250,247,241,.48);
    background: rgba(250,247,241,.12);
    box-shadow: 0 18px 34px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn-glass:hover { transform: translateY(-1px); background: rgba(250,247,241,.2); border-color: rgba(250,247,241,.75); }

  .hero-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 178px;
    border: 1px solid rgba(250,247,241,.34);
    border-radius: 999px;
    padding: 13px 22px;
    color: #FAF7F1;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    line-height: 1;
    overflow: hidden;
    text-transform: uppercase;
    transition: transform .24s ease, border-color .24s ease, background .24s ease, box-shadow .24s ease;
  }
  .hero-cta::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.06));
    opacity: .75;
    pointer-events: none;
  }
  .hero-cta span, .hero-cta svg {
    position: relative;
    z-index: 1;
  }
  .hero-cta-primary {
    background: rgba(250,247,241,.18);
    box-shadow: 0 18px 44px -26px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.32);
    backdrop-filter: blur(16px);
  }
  .hero-cta-secondary {
    background: rgba(20,14,10,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: blur(10px);
  }
  .hero-cta:hover {
    transform: translateY(-2px);
    border-color: rgba(250,247,241,.72);
    background: rgba(250,247,241,.23);
    box-shadow: 0 22px 54px -28px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.36);
  }
  .hero-cta:active {
    transform: translateY(0);
  }

  .floating-nav {
    position: fixed;
    left: 50%;
    top: 18px;
    z-index: 50;
    display: flex;
    gap: 4px;
    padding: 6px;
    border: 1px solid rgba(216,201,174,.78);
    border-radius: 999px;
    background: rgba(251,248,241,.82);
    box-shadow: 0 20px 45px -30px rgba(62,44,32,.55);
    backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -14px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .floating-nav.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .floating-nav button {
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--espresso);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: .16em;
    padding: 10px 13px;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
  }
  .floating-nav button:hover {
    background: var(--espresso);
    color: var(--bg);
  }

  @media (max-width: 640px) {
    .floating-nav {
      bottom: 12px;
      top: auto;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
    }
    .floating-nav button {
      white-space: nowrap;
      padding-inline: 11px;
    }
  }

  /* radio chip + checkbox */
  .chip {
    border: 1px solid #E0D2B7; background: #FBF8F1; color: var(--espresso);
    transition: all .2s ease;
  }
  .chip:hover { border-color: var(--mocha); background: #F1E7D3; }
  .chip.is-on {
    background: #3E2C20; color: #FAF7F1; border-color: #3E2C20;
    box-shadow: 0 6px 18px -8px rgba(62,44,32,.55);
  }

  /* hide native radio/checkbox visuals; we draw our own */
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* gallery hover */
  .ph {
    overflow: hidden; border-radius: 6px; position: relative;
    box-shadow: 0 18px 40px -28px rgba(62,44,32,.55);
  }
  .ph img { transition: transform 1.2s cubic-bezier(.2,.8,.2,1), filter .6s ease; display:block; width:100%; height:100%; object-fit:cover; }
  .ph:hover img { transform: scale(1.06); filter: saturate(1.05); }
  .ph::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    border-radius: inherit;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 64px 20px 48px;
    background: rgba(31,20,12,.86);
    backdrop-filter: blur(10px);
  }
  .lightbox img {
    max-width: min(92vw, 920px);
    max-height: 78vh;
    border-radius: 8px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.75);
    object-fit: contain;
  }
  .lightbox p {
    margin-top: 16px;
    color: #FAF7F1;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: .08em;
  }
  .lightbox-close, .lightbox-nav {
    position: absolute;
    border: 1px solid rgba(250,247,241,.35);
    border-radius: 999px;
    background: rgba(250,247,241,.12);
    color: #FAF7F1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s ease, transform .2s ease;
  }
  .lightbox-close {
    right: 22px;
    top: 22px;
    height: 44px;
    width: 44px;
  }
  .lightbox-nav {
    top: 50%;
    height: 52px;
    width: 52px;
    transform: translateY(-50%);
  }
  .lightbox-nav span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    line-height: 1;
    margin-top: -4px;
  }
  .lightbox-close:hover, .lightbox-nav:hover {
    background: rgba(250,247,241,.22);
  }

  /* card */
  .card {
    background: #FBF8F1;
    border: 1px solid #E7D9BE;
    border-radius: 4px;
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 30px 50px -32px rgba(62,44,32,.45); border-color: var(--mocha); }

  /* monogram script flourish */
  .ampersand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }

  /* subtle paper grain on bg */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1200px 600px at 10% 0%, rgba(184,155,122,.08), transparent 60%),
      radial-gradient(900px 500px at 90% 100%, rgba(139,111,78,.07), transparent 60%);
  }

  /* timeline dot pulse */
  @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(139,111,78,.35);} 50% { box-shadow: 0 0 0 10px rgba(139,111,78,0);} }
  .pulse-dot { animation: pulse-dot 2.6s ease-out infinite; }

  /* RSVP step indicator */
  .step-dot {
    width: 28px; height: 28px; border-radius: 999px;
    display: grid; place-items: center;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    background: #FBF8F1; border: 1px solid var(--line); color: var(--coffee);
    transition: all .3s ease;
  }
  .step-dot.is-active { background: #3E2C20; color: #FAF7F1; border-color: #3E2C20; box-shadow: 0 6px 16px -8px rgba(62,44,32,.55); }
  .step-dot.is-done   { background: var(--coffee); color: #FAF7F1; border-color: var(--coffee); }
  .step-bar { flex: 1; height: 1px; background: var(--line); position: relative; overflow: hidden; }
  .step-bar > span { position: absolute; inset: 0; background: var(--coffee); transform-origin: left; transition: transform .5s ease; }

  .faq-item summary {
    list-style: none;
    position: relative;
    padding-right: 34px;
  }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after {
    content: "+";
    position: absolute;
    right: 0;
    top: 0;
    color: var(--coffee);
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    line-height: 1;
    transition: transform .2s ease;
  }
  .faq-item[open] summary::after {
    transform: rotate(45deg);
  }

  @keyframes confetti-fall {
    0% { opacity: 0; transform: translate3d(0,-40px,0) rotate(0deg); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(32px,90vh,0) rotate(520deg); }
  }
  .confetti-layer {
    pointer-events: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
  }
  .confetti-piece {
    position: absolute;
    top: -18px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    background: var(--coffee);
    animation: confetti-fall 2.6s ease-in forwards;
  }
  .confetti-piece:nth-child(3n) { background: var(--mocha); }
  .confetti-piece:nth-child(4n) { background: #D8C9AE; }
  .confetti-piece:nth-child(5n) { width: 6px; height: 6px; border-radius: 999px; }

  @media (prefers-reduced-motion: reduce) {
    .kenburns, .drift, .pulse-dot, .tick, .confetti-piece {
      animation: none !important;
    }
    .floating-nav, .lightbox-close, .lightbox-nav {
      transition: none;
    }
    .reveal {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }

  /* selection */
  ::selection { background: #3E2C20; color: #FAF7F1; }
</style>

</head>
<body class="font-body">
  <div id="root" class="relative z-10"></div>

  <script type="module" src="/app.jsx"></script>
</body>
</html>
