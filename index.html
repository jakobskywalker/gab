<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Izla &amp; Gabriel · 7. November 2026</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;500;700&family=Cormorant:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream:    '#FAF7F1',
          ivory:    '#F5EFE3',
          sand:     '#E9DFCC',
          mocha:    '#B89B7A',
          coffee:   '#8B6F4E',
          espresso: '#3E2C20',
          ink:      '#2B1F16',
        },
        fontFamily: {
          display: ['"Playfair Display"', 'serif'],
          script:  ['"Cormorant Garamond"', 'serif'],
          body:    ['Lato', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --bg: #FAF7F1;
    --bg-soft: #F5EFE3;
    --line: #D8C9AE;
    --mocha: #B89B7A;
    --coffee: #8B6F4E;
    --espresso: #3E2C20;
    --ink: #2B1F16;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: 'Lato', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Playfair Display', serif; }
  .font-script  { font-family: 'Cormorant Garamond', serif; }

  .font-micro {
    font-size: 10px;
    letter-spacing: .34em;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .editorial-kicker {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    color: var(--coffee);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
    letter-spacing: .18em;
  }
  .editorial-kicker::before,
  .editorial-kicker::after {
    content: "";
    display: block;
    width: 34px;
    height: 1px;
    background: linear-gradient(90deg, transparent, currentColor);
    opacity: .55;
  }
  .editorial-kicker::after {
    background: linear-gradient(90deg, currentColor, transparent);
  }

  .section-shell {
    position: relative;
    isolation: isolate;
  }
  .section-shell::before {
    content: "";
    position: absolute;
    inset: 14px;
    z-index: -1;
    border: 1px solid rgba(216,201,174,.38);
    pointer-events: none;
  }

  .section-label {
    position: absolute;
    left: max(18px, calc((100vw - 1180px) / 2));
    top: 44px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: rgba(139,111,78,.55);
    font-size: 10px;
    letter-spacing: .34em;
    text-transform: uppercase;
  }

  .monogram-seal {
    position: relative;
    display: grid;
    place-items: center;
    border: 1px solid rgba(216,201,174,.78);
    border-radius: 999px;
    color: currentColor;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
  }
  .monogram-seal::before,
  .monogram-seal::after {
    content: "";
    position: absolute;
    border-radius: inherit;
    pointer-events: none;
  }
  .monogram-seal::before {
    inset: 7px;
    border: 1px solid rgba(216,201,174,.48);
  }
  .monogram-seal::after {
    inset: -10px;
    border: 1px solid rgba(216,201,174,.18);
  }

  .ornament-corners {
    position: relative;
  }
  .ornament-corners::before,
  .ornament-corners::after {
    content: "";
    position: absolute;
    width: 74px;
    height: 74px;
    border-color: rgba(184,155,122,.58);
    pointer-events: none;
  }
  .ornament-corners::before {
    left: 16px;
    top: 16px;
    border-left: 1px solid;
    border-top: 1px solid;
  }
  .ornament-corners::after {
    right: 16px;
    bottom: 16px;
    border-right: 1px solid;
    border-bottom: 1px solid;
  }

  .hero-date-ghost {
    position: absolute;
    left: 50%;
    top: 51%;
    transform: translate(-50%, -50%);
    color: rgba(250,247,241,.08);
    font-family: 'Playfair Display', serif;
    font-size: clamp(8rem, 24vw, 24rem);
    letter-spacing: -.08em;
    line-height: .75;
    white-space: nowrap;
    pointer-events: none;
  }

  .hero-editorial {
    background:
      radial-gradient(900px 520px at 82% 18%, rgba(184,155,122,.22), transparent 58%),
      linear-gradient(115deg, #FAF7F1 0%, #FAF7F1 52%, #EFE4D0 52.2%, #F5EFE3 100%);
  }

  .hero-editorial::before {
    content: "";
    position: absolute;
    inset: 24px;
    border: 1px solid rgba(184,155,122,.42);
    pointer-events: none;
  }

  .hero-editorial::after {
    content: "07";
    position: absolute;
    right: clamp(-1.8rem, 3vw, 4rem);
    bottom: clamp(1rem, 4vw, 4rem);
    color: rgba(62,44,32,.055);
    font-family: 'Playfair Display', serif;
    font-size: clamp(10rem, 28vw, 28rem);
    letter-spacing: -.1em;
    line-height: .72;
    pointer-events: none;
  }

  .hero-image-panel {
    position: relative;
    overflow: hidden;
    border-radius: 34px 34px 4px 34px;
    box-shadow: 0 44px 100px -58px rgba(62,44,32,.72);
    animation: hero-image-reveal 1.15s cubic-bezier(.2,.8,.2,1) .18s both;
  }

  .hero-image-panel::before {
    content: "";
    position: absolute;
    inset: 14px;
    z-index: 2;
    border: 1px solid rgba(250,247,241,.42);
    border-radius: 24px 24px 3px 24px;
    pointer-events: none;
  }

  .hero-image-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(20,14,10,.02), rgba(20,14,10,.42)),
      radial-gradient(circle at 50% 18%, transparent 0 42%, rgba(20,14,10,.36) 100%);
    pointer-events: none;
  }

  .hero-invite-card {
    background:
      linear-gradient(145deg, rgba(255,252,245,.96), rgba(245,239,227,.9)),
      repeating-linear-gradient(90deg, rgba(62,44,32,.025) 0 1px, transparent 1px 5px);
    border: 1px solid rgba(184,155,122,.5);
    box-shadow: 0 30px 80px -62px rgba(62,44,32,.8), inset 0 1px 0 rgba(255,255,255,.9);
  }

  .hero-cinematic {
    background: #160f0a;
  }
  .hero-cinematic::before {
    content: "";
    position: absolute;
    inset: 22px;
    z-index: 3;
    border: 1px solid rgba(250,247,241,.28);
    pointer-events: none;
  }
  .hero-cinematic-title {
    text-shadow: 0 26px 70px rgba(0,0,0,.55);
  }

  .hero-invitation {
    background:
      radial-gradient(700px 420px at 10% 0%, rgba(184,155,122,.16), transparent 62%),
      radial-gradient(760px 460px at 92% 78%, rgba(139,111,78,.12), transparent 62%),
      #FAF7F1;
  }
  .hero-paper-card {
    position: relative;
    background:
      linear-gradient(145deg, rgba(255,253,248,.98), rgba(245,239,227,.94)),
      repeating-linear-gradient(90deg, rgba(62,44,32,.018) 0 1px, transparent 1px 6px);
    border: 1px solid rgba(184,155,122,.48);
    box-shadow: 0 42px 110px -72px rgba(62,44,32,.78), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .hero-paper-card::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(216,201,174,.62);
    pointer-events: none;
  }

  .hero-frame {
    position: absolute;
    inset: clamp(18px, 3vw, 42px);
    border: 1px solid rgba(250,247,241,.24);
    pointer-events: none;
  }
  .hero-frame::before,
  .hero-frame::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(250,247,241,.12);
  }
  .hero-frame::after {
    inset: auto 18%;
    top: -1px;
    height: 1px;
    border: 0;
    background: linear-gradient(90deg, transparent, rgba(250,247,241,.82), transparent);
  }

  .lux-panel {
    background:
      linear-gradient(135deg, rgba(255,252,245,.92), rgba(245,239,227,.82)),
      radial-gradient(circle at 12% 0%, rgba(184,155,122,.18), transparent 42%);
    border: 1px solid rgba(216,201,174,.86);
    box-shadow: 0 34px 80px -58px rgba(62,44,32,.72), inset 0 1px 0 rgba(255,255,255,.78);
  }

  .script-watermark {
    position: absolute;
    color: rgba(184,155,122,.12);
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(6rem, 18vw, 16rem);
    font-style: italic;
    line-height: .7;
    pointer-events: none;
    z-index: -1;
  }

  .album-frame {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(184,155,122,.42);
    background: #F8F1E5;
    box-shadow: 0 34px 90px -58px rgba(62,44,32,.72);
    transform-origin: center bottom;
  }
  .album-frame::before {
    content: "";
    position: absolute;
    inset: 12px;
    z-index: 2;
    border: 1px solid rgba(250,247,241,.42);
    pointer-events: none;
  }
  .gallery-album .album-frame::before {
    display: none;
  }
  .gallery-album .photo-number {
    display: none;
  }
  .album-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.96) contrast(.98) sepia(.08);
    transition: transform 1.25s cubic-bezier(.2,.8,.2,1), filter .6s ease;
  }
  .album-frame:hover img {
    transform: scale(1.045);
    filter: saturate(1.04) contrast(1) sepia(.05);
  }

  .album-caption {
    background: rgba(250,247,241,.9);
    border: 1px solid rgba(216,201,174,.72);
    box-shadow: 0 26px 60px -46px rgba(62,44,32,.72);
    backdrop-filter: blur(14px);
  }

  .photo-number {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid rgba(184,155,122,.55);
    border-radius: 999px;
    color: var(--coffee);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
  }

  .contact-sheet {
    background:
      linear-gradient(145deg, rgba(255,252,245,.82), rgba(245,239,227,.7)),
      repeating-linear-gradient(90deg, rgba(62,44,32,.035) 0 1px, transparent 1px 26px);
    border: 1px solid rgba(216,201,174,.72);
  }

  .magazine-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--coffee), transparent);
    opacity: .35;
  }

  .route-board {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(700px 360px at 18% 8%, rgba(184,155,122,.18), transparent 64%),
      radial-gradient(760px 420px at 90% 92%, rgba(139,111,78,.12), transparent 62%),
      linear-gradient(145deg, rgba(255,252,245,.9), rgba(245,239,227,.76));
    border: 1px solid rgba(216,201,174,.86);
    box-shadow: 0 42px 110px -78px rgba(62,44,32,.8), inset 0 1px 0 rgba(255,255,255,.76);
  }
  .route-board::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(216,201,174,.44);
    pointer-events: none;
  }
  .route-board::after {
    content: "AUGSBURG / ELCHINGEN";
    position: absolute;
    right: -28px;
    top: 46%;
    transform: rotate(90deg);
    color: rgba(139,111,78,.18);
    font-size: 10px;
    letter-spacing: .42em;
  }

  .route-path,
  .route-path-progress {
    position: absolute;
    left: 50%;
    top: 148px;
    bottom: 92px;
    width: 1px;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .route-path {
    background: linear-gradient(180deg, transparent, rgba(216,201,174,.95) 10%, rgba(216,201,174,.95) 90%, transparent);
  }
  .route-path-progress {
    bottom: auto;
    height: 0;
    background: linear-gradient(180deg, var(--coffee), rgba(139,111,78,.18));
    transition: height .35s ease-out;
  }

  .route-stop {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr);
    align-items: center;
    min-height: 188px;
  }
  .route-stop + .route-stop {
    margin-top: 14px;
  }
  .route-stop.is-left .route-ticket {
    grid-column: 1;
    justify-self: end;
    text-align: right;
  }
  .route-stop.is-right .route-ticket {
    grid-column: 3;
    justify-self: start;
  }
  .route-node {
    grid-column: 2;
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    gap: 10px;
  }
  .route-dot {
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    border-radius: 999px;
    background: var(--espresso);
    color: var(--bg);
    border: 6px solid rgba(250,247,241,.94);
    box-shadow: 0 18px 38px -24px rgba(62,44,32,.85);
  }
  .route-index {
    color: rgba(139,111,78,.72);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
  }

  .route-ticket {
    position: relative;
    width: min(100%, 390px);
    padding: 24px;
    background:
      linear-gradient(145deg, rgba(255,253,248,.95), rgba(245,239,227,.86)),
      repeating-linear-gradient(90deg, rgba(62,44,32,.02) 0 1px, transparent 1px 8px);
    border: 1px solid rgba(216,201,174,.92);
    box-shadow: 0 30px 80px -58px rgba(62,44,32,.72), inset 0 1px 0 rgba(255,255,255,.82);
  }
  .route-ticket::before {
    content: "";
    position: absolute;
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(184,155,122,.45), transparent);
  }
  .route-stop.is-left .route-ticket::before {
    right: 18px;
  }
  .route-stop.is-right .route-ticket::before {
    left: 18px;
  }

  @media (max-width: 768px) {
    .route-board::after { display: none; }
    .route-path,
    .route-path-progress {
      left: 35px;
      top: 132px;
      bottom: 80px;
    }
    .route-stop {
      grid-template-columns: 70px minmax(0, 1fr);
      min-height: auto;
      gap: 0;
      padding: 16px 0;
    }
    .route-stop.is-left .route-ticket,
    .route-stop.is-right .route-ticket {
      grid-column: 2;
      justify-self: stretch;
      text-align: left;
    }
    .route-node {
      grid-column: 1;
      grid-row: 1;
    }
    .route-ticket::before {
      display: none;
    }
  }

  /* small utilities */
  .hairline { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
  .vline    { width: 1px;  background: linear-gradient(180deg, transparent, var(--line), transparent); }

  /* fade-in on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.is-in { opacity: 1; transform: none; }

  /* hero ken-burns */
  @keyframes kenburns { 0% { transform: scale(1.04) translate(0,0); } 100% { transform: scale(1.14) translate(-1.5%, -1%); } }
  .kenburns { animation: kenburns 22s ease-in-out infinite alternate; }

  /* gentle floating leaf icons */
  @keyframes drift { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .drift { animation: drift 6s ease-in-out infinite; }

  /* shimmer on countdown numbers when they tick */
  @keyframes tick { 0% { transform: translateY(-6px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .tick { animation: tick .4s ease; }

  /* RSVP focus rings */
  .field {
    background: #FBF8F1;
    border: 1px solid #E0D2B7;
    color: var(--espresso);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field:focus { outline: none; border-color: var(--coffee); box-shadow: 0 0 0 4px rgba(139,111,78,.12); background: #fff; }

  /* button */
  .btn-primary {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #8B6F4E 0%, #6B5239 100%);
    color: #FAF7F1;
    box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 24px -10px rgba(62,44,32,.5);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    letter-spacing: .04em;
  }
  .btn-primary::after {
    content: "";
    position: absolute;
    inset: -40% auto -40% -45%;
    width: 34%;
    transform: skewX(-18deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 14px 28px -10px rgba(62,44,32,.55); }
  .btn-primary:hover::after { animation: button-sheen .85s ease; }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent; color: var(--espresso); border: 1px solid var(--line);
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn-ghost:hover { background: #F1E7D3; border-color: var(--mocha); }

  .btn-glass {
    color: #FAF7F1;
    border: 1px solid rgba(250,247,241,.48);
    background: rgba(250,247,241,.12);
    box-shadow: 0 18px 34px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn-glass:hover { transform: translateY(-1px); background: rgba(250,247,241,.2); border-color: rgba(250,247,241,.75); }

  .hero-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 178px;
    border: 1px solid rgba(250,247,241,.34);
    border-radius: 999px;
    padding: 13px 22px;
    color: #FAF7F1;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    line-height: 1;
    overflow: hidden;
    text-transform: uppercase;
    transition: transform .24s ease, border-color .24s ease, background .24s ease, box-shadow .24s ease;
  }
  .hero-cta::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.06));
    opacity: .75;
    pointer-events: none;
  }
  .hero-cta span, .hero-cta svg {
    position: relative;
    z-index: 1;
  }
  .hero-cta-primary {
    background: rgba(250,247,241,.18);
    box-shadow: 0 18px 44px -26px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.32);
    backdrop-filter: blur(16px);
  }
  .hero-cta-secondary {
    background: rgba(20,14,10,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: blur(10px);
  }
  .hero-cta:hover {
    transform: translateY(-2px);
    border-color: rgba(250,247,241,.72);
    background: rgba(250,247,241,.23);
    box-shadow: 0 22px 54px -28px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.36);
  }
  .hero-cta:active {
    transform: translateY(0);
  }

  .floating-nav {
    position: fixed;
    left: 50%;
    top: 18px;
    z-index: 50;
    display: flex;
    gap: 4px;
    padding: 6px;
    border: 1px solid rgba(216,201,174,.78);
    border-radius: 999px;
    background: rgba(251,248,241,.82);
    box-shadow: 0 20px 45px -30px rgba(62,44,32,.55);
    backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -14px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .floating-nav.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .floating-nav button {
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--espresso);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: .16em;
    padding: 10px 13px;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
  }
  .floating-nav button:hover {
    background: var(--espresso);
    color: var(--bg);
  }

  @media (max-width: 640px) {
    .floating-nav {
      bottom: 12px;
      top: auto;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
    }
    .floating-nav button {
      white-space: nowrap;
      padding-inline: 11px;
    }
  }

  /* radio chip + checkbox */
  .chip {
    border: 1px solid #E0D2B7; background: #FBF8F1; color: var(--espresso);
    transition: all .2s ease;
  }
  .chip:hover { border-color: var(--mocha); background: #F1E7D3; }
  .chip.is-on {
    background: #3E2C20; color: #FAF7F1; border-color: #3E2C20;
    box-shadow: 0 6px 18px -8px rgba(62,44,32,.55);
  }

  /* hide native radio/checkbox visuals; we draw our own */
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* gallery hover */
  .ph {
    overflow: hidden; border-radius: 14px; position: relative;
    box-shadow: 0 26px 60px -38px rgba(62,44,32,.72);
  }
  .ph img { transition: transform 1.2s cubic-bezier(.2,.8,.2,1), filter .6s ease; display:block; width:100%; height:100%; object-fit:cover; }
  .ph:hover img { transform: scale(1.06); filter: saturate(1.05); }
  .ph::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    border-radius: inherit;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 64px 20px 48px;
    background: rgba(31,20,12,.86);
    backdrop-filter: blur(10px);
    animation: lightbox-fade .24s ease-out both;
  }
  .lightbox img {
    max-width: min(92vw, 920px);
    max-height: 78vh;
    border-radius: 8px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.75);
    object-fit: contain;
    animation: lightbox-image-in .42s cubic-bezier(.2,.8,.2,1) .05s both;
  }
  .lightbox p {
    margin-top: 16px;
    color: #FAF7F1;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: .08em;
    animation: lightbox-caption-in .42s ease .18s both;
  }
  .lightbox-close, .lightbox-nav {
    position: absolute;
    border: 1px solid rgba(250,247,241,.35);
    border-radius: 999px;
    background: rgba(250,247,241,.12);
    color: #FAF7F1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s ease, transform .2s ease;
  }
  .lightbox-close {
    right: 22px;
    top: 22px;
    height: 44px;
    width: 44px;
  }
  .lightbox-nav {
    top: 50%;
    height: 52px;
    width: 52px;
    transform: translateY(-50%);
  }
  .lightbox-nav span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    line-height: 1;
    margin-top: -4px;
  }
  .lightbox-close:hover, .lightbox-nav:hover {
    background: rgba(250,247,241,.22);
  }

  /* card */
  .card {
    background:
      linear-gradient(145deg, rgba(255,252,245,.92), rgba(245,239,227,.78)),
      #FBF8F1;
    border: 1px solid rgba(231,217,190,.95);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 34px 70px -46px rgba(62,44,32,.58); border-color: var(--mocha); }

  /* monogram script flourish */
  .ampersand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }

  /* subtle paper grain on bg */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1200px 600px at 10% 0%, rgba(184,155,122,.08), transparent 60%),
      radial-gradient(900px 500px at 90% 100%, rgba(139,111,78,.07), transparent 60%),
      repeating-linear-gradient(90deg, rgba(62,44,32,.018) 0 1px, transparent 1px 5px);
    mix-blend-mode: multiply;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .36;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(62,44,32,.055) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 65%, rgba(184,155,122,.06) 0 1px, transparent 1px);
    background-size: 9px 9px, 13px 13px;
  }

  /* timeline dot pulse */
  @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(139,111,78,.35);} 50% { box-shadow: 0 0 0 10px rgba(139,111,78,0);} }
  .pulse-dot { animation: pulse-dot 2.6s ease-out infinite; }

  /* RSVP step indicator */
  .step-dot {
    width: 28px; height: 28px; border-radius: 999px;
    display: grid; place-items: center;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    background: #FBF8F1; border: 1px solid var(--line); color: var(--coffee);
    transition: all .3s ease;
  }
  .step-dot.is-active { background: #3E2C20; color: #FAF7F1; border-color: #3E2C20; box-shadow: 0 6px 16px -8px rgba(62,44,32,.55); }
  .step-dot.is-done   { background: var(--coffee); color: #FAF7F1; border-color: var(--coffee); }
  .step-bar { flex: 1; height: 1px; background: var(--line); position: relative; overflow: hidden; }
  .step-bar > span { position: absolute; inset: 0; background: var(--coffee); transform-origin: left; transition: transform .5s ease; }
  .rsvp-step {
    animation: rsvp-step-in .42s cubic-bezier(.2,.8,.2,1) both;
  }

  .faq-item summary {
    list-style: none;
    position: relative;
    padding-right: 34px;
  }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after {
    content: "+";
    position: absolute;
    right: 0;
    top: 0;
    color: var(--coffee);
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    line-height: 1;
    transition: transform .2s ease;
  }
  .faq-item[open] summary::after {
    transform: rotate(45deg);
  }

  @keyframes confetti-fall {
    0% { opacity: 0; transform: translate3d(0,-40px,0) rotate(0deg); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(32px,90vh,0) rotate(520deg); }
  }
  .confetti-layer {
    pointer-events: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
  }
  .confetti-piece {
    position: absolute;
    top: -18px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    background: var(--coffee);
    animation: confetti-fall 2.6s ease-in forwards;
  }
  .confetti-piece:nth-child(3n) { background: var(--mocha); }
  .confetti-piece:nth-child(4n) { background: #D8C9AE; }
  .confetti-piece:nth-child(5n) { width: 6px; height: 6px; border-radius: 999px; }

  @keyframes hero-image-reveal {
    from { clip-path: inset(0 0 100% 0 round 34px 34px 4px 34px); transform: translateY(12px); opacity: .72; }
    to { clip-path: inset(0 0 0 0 round 34px 34px 4px 34px); transform: translateY(0); opacity: 1; }
  }

  @keyframes image-mask-in {
    from { clip-path: inset(0 0 18% 0); opacity: .78; transform: translateY(14px); }
    to { clip-path: inset(0 0 0 0); opacity: 1; transform: translateY(0); }
  }

  @keyframes lightbox-fade {
    from { opacity: 0; backdrop-filter: blur(0); }
    to { opacity: 1; backdrop-filter: blur(10px); }
  }

  @keyframes lightbox-image-in {
    from { opacity: 0; transform: scale(.965) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes lightbox-caption-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes button-sheen {
    0% { left: -45%; opacity: 0; }
    18% { opacity: 1; }
    100% { left: 112%; opacity: 0; }
  }

  @keyframes rsvp-step-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal.is-in .album-frame {
    animation: image-mask-in .72s cubic-bezier(.2,.8,.2,1) both;
  }

  @media (prefers-reduced-motion: reduce) {
    .kenburns, .drift, .pulse-dot, .tick, .confetti-piece,
    .hero-image-panel, .lightbox, .lightbox img, .lightbox p,
    .btn-primary::after, .rsvp-step, .reveal.is-in .album-frame {
      animation: none !important;
    }
    .floating-nav, .lightbox-close, .lightbox-nav, .album-frame img {
      transition: none;
    }
    .reveal {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }

  @media (max-width: 768px) {
    .section-shell::before { inset: 8px; }
    .section-label { display: none; }
    .ornament-corners::before,
    .ornament-corners::after { width: 48px; height: 48px; }
    .hero-editorial {
      background:
        radial-gradient(640px 420px at 80% 8%, rgba(184,155,122,.22), transparent 62%),
        #FAF7F1;
    }
    .hero-editorial::before { inset: 10px; }
    .hero-editorial::after { opacity: .7; }
    .hero-image-panel { border-radius: 24px 24px 4px 24px; }
  }

  /* selection */
  ::selection { background: #3E2C20; color: #FAF7F1; }
</style>

</head>
<body class="font-body">
  <div id="root" class="relative z-10"></div>

  <script type="module" src="/app.jsx"></script>
</body>
